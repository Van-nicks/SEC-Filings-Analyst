[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filings-analyst"
version = "0.1.0"
requires-python = ">=3.12"
# Dependencies are managed in requirements.txt / requirements.lock.txt.

[tool.setuptools.packages.find]
where = ["src"]
include = ["filing_analyst*"]
