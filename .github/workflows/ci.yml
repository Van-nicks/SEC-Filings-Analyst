name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify syntax and module compilation
        run: |
          python -m py_compile src/filing_analyst/config.py \
            src/filing_analyst/ingest/chunk.py \
            src/filing_analyst/ingest/sec_fetch.py \
            src/filing_analyst/graph/build_index.py \
            src/filing_analyst/graph/load_facts.py \
            src/filing_analyst/graph/retriever.py \
            src/filing_analyst/llm/models.py \
            src/filing_analyst/agent/agents.py \
            eval/eval_ragas.py \
            eval/eval_ablation.py

      - name: Run unit and data-integrity tests
        env:
          AWS_DEFAULT_REGION: eu-west-2
        run: |
          pytest tests/test_calculator.py tests/test_data_artifacts.py -v
